name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint (Ruff + mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: ruff check src/

      - name: mypy check
        run: mypy src/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truckbot
          POSTGRES_PASSWORD: changeme_strong_password
          POSTGRES_DB: truck_factory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for tests
        run: |
          cat > .env << EOF
          BOT_TOKEN=test_token
          ADMIN_IDS=[123456789]
          ENVIRONMENT=testing
          LOG_LEVEL=WARNING
          POSTGRES_USER=truckbot
          POSTGRES_PASSWORD=changeme_strong_password
          POSTGRES_DB=truck_factory_test
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          EOF

      - name: Run tests
        run: pytest -v --cov=src --cov-report=term

  build:
    name: Build (Docker)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t truck-factory-bot:test .
