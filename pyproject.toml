[project]
name = "truck-factory-bot"
version = "0.1.0"
description = "Truck Factory Telegram Bot"
requires-python = ">=3.11"

# ==================== RUFF ====================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long
    "B008",   # function call in default arg (aiogram)
    "N818",   # error suffix
    "RUF001", # ambiguous unicode (emoji)
    "RUF002", # ambiguous unicode docstring
    "RUF003", # ambiguous unicode comment
    "UP042",  # str+Enum (bizga kerak)
    "SIM105", # contextlib.suppress
    "SIM108", # ternary operator
    "F841",   # unused variable
    "F811",   # redefinition
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
lines-after-imports = 2

# ==================== MYPY ====================
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
show_error_codes = true
check_untyped_defs = false
exclude = ["migrations", "tests"]

[[tool.mypy.overrides]]
module = [
    "aiogram.*",
    "apscheduler.*",
    "matplotlib.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.bot.handlers.*",
    "src.bot.keyboards.*",
    "src.bot.middlewares.*",
]
disallow_untyped_defs = false
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["union-attr", "arg-type", "assignment", "index", "attr-defined"]

# ==================== PYTEST ====================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
    "unit: Unit testlar",
    "integration: Integration testlar",
    "e2e: End-to-end testlar",
    "slow: Sekin testlar",
]

# ==================== COVERAGE ====================
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
